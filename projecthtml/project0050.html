<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>0050 – _panoramortraits</title>
    <link rel="stylesheet" href="../assets/css/project.css" />
  </head>
  <body>
    <a href="../index.html" class="project-number-fixed" aria-label="Back to all projects">0050</a>
    <header class="project-hero">
      <video class="project-trailer" src="../projects/0050-panoramortraits/trailer.mp4" autoplay loop muted playsinline></video>
      <div class="project-header-overlay">
        <h1 class="project-title">_panoramortraits</h1>
        <p class="project-desc">This project shows how 36 analog exposures can turn a changing room into a continuous archive of space, time, and memory.</p>
      </div>
    </header>
    <hr />
    <main class="project-main">
      <section class="project-right" aria-label="Project gallery"><div class="project-media-row"><div class="project-media-item"><img class="project-media" src="../projects/0050-panoramortraits/image1.gif" alt="_panoramortraits — image 1" loading="lazy" decoding="async" /></div></div>
<div class="project-media-row"><div class="project-media-item"><img class="project-media" src="../projects/0050-panoramortraits/image2.jpeg" alt="_panoramortraits — image 2" loading="lazy" decoding="async" /></div></div>
<div class="project-media-row"><div class="project-media-item"><img class="project-media" src="../projects/0050-panoramortraits/image3.jpeg" alt="_panoramortraits — image 3" loading="lazy" decoding="async" /></div></div>
<div class="project-media-row"><div class="project-media-item"><img class="project-media" src="../projects/0050-panoramortraits/image4.jpeg" alt="_panoramortraits — image 4" loading="lazy" decoding="async" /></div></div></section>
    </main>
    <nav class="project-nav" aria-label="Project navigation"><a class="nav-btn" href="project0051.html" aria-label="Previous project"><svg viewBox="0 0 60 60" width="80" height="80" style="overflow:visible;" xmlns="http://www.w3.org/2000/svg"><polyline points="40,10 20,30 40,50" fill="none" stroke="#bbb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg></a><a class="nav-btn" href="../index.html" aria-label="Back to all projects"><svg viewBox="0 0 60 60" width="80" height="80" style="overflow:visible;" xmlns="http://www.w3.org/2000/svg"><polyline points="10,40 30,20 50,40" fill="none" stroke="#bbb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg></a><a class="nav-btn" href="project0013.html" aria-label="Next project"><svg viewBox="0 0 60 60" width="80" height="80" style="overflow:visible;" xmlns="http://www.w3.org/2000/svg"><polyline points="20,10 40,30 20,50" fill="none" stroke="#bbb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg></a></nav> <div class="also-like-section">
      <p class="also-like-title">u might also like</p>
      <div class="also-like-container">
        <a class="also-like-project" href="project2409.html">
          <img src="../projects/2409-about/icon.png" alt="icon" class="also-like-img" />
          <span class="also-like-label">2409</span>
        </a>
      </div>
    </div>
    

    <!-- slideshow overlay used when clicking project images -->
    <div id="slideshow-overlay" role="dialog" aria-modal="true" aria-label="Project image viewer" aria-hidden="true">
      <button id="slideshow-close" type="button" aria-label="Close image viewer">&times;</button>
      <img id="slideshow-img" src="" alt="" />
      <button id="slideshow-prev" class="slideshow-nav" type="button" aria-label="Previous image">&#10094;</button>
      <button id="slideshow-next" class="slideshow-nav" type="button" aria-label="Next image">&#10095;</button>
      <div id="slideshow-counter" aria-live="polite"></div>
    </div>

    <script>
      const trailer = document.querySelector(".project-trailer");
      if (trailer && trailer.tagName === "VIDEO") {
        trailer.muted = true;
        trailer.autoplay = true;
        trailer.playsInline = true;
        trailer.play().catch(function () {
          // Try to play again on user interaction if autoplay was blocked
          const tryPlay = function () {
            trailer.play();
            window.removeEventListener("click", tryPlay);
          };
          window.addEventListener("click", tryPlay);
        });
      }
      if (trailer) {
        trailer.addEventListener("click", function () {
          if (trailer.requestFullscreen) trailer.requestFullscreen();
          else if (trailer.webkitRequestFullscreen)
            trailer.webkitRequestFullscreen();
          else if (trailer.msRequestFullscreen) trailer.msRequestFullscreen();
        });
      }

      // slideshow logic for clickable images
      (function () {
        const images = Array.from(document.querySelectorAll('.project-right img'));
        if (!images.length) return;
        const projectTitle = document.querySelector('.project-title')?.textContent.trim() || 'Project';
        images.forEach((img, idx) => {
          img.dataset.index = idx;
          if (!img.alt) img.alt = `${projectTitle} — image ${idx + 1}`;
          img.tabIndex = 0;
          img.setAttribute('role', 'button');
          img.setAttribute('aria-label', `Open image ${idx + 1} of ${images.length}`);
        });
        const overlay = document.getElementById('slideshow-overlay');
        const slideshowImg = document.getElementById('slideshow-img');
        const closeBtn = document.getElementById('slideshow-close');
        const prevBtn = document.getElementById('slideshow-prev');
        const nextBtn = document.getElementById('slideshow-next');
        const counter = document.getElementById('slideshow-counter');
        let currentIndex = 0;
        let previouslyFocused = null;
        const showSlide = (i) => {
          currentIndex = (i + images.length) % images.length;
          slideshowImg.src = images[currentIndex].src;
          slideshowImg.alt = images[currentIndex].alt;
          counter.textContent = `${currentIndex + 1} / ${images.length}`;
          overlay.classList.add('active');
          overlay.setAttribute('aria-hidden', 'false');
          document.body.style.overflow = 'hidden';
          closeBtn.focus();
        };
        const hideSlide = () => {
          overlay.classList.remove('active');
          overlay.setAttribute('aria-hidden', 'true');
          document.body.style.overflow = '';
          if (previouslyFocused) previouslyFocused.focus();
        };
        images.forEach(img => {
          const openImage = () => {
            previouslyFocused = img;
            showSlide(parseInt(img.dataset.index));
          };
          img.addEventListener('click', openImage);
          img.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openImage();
            }
          });
        });
        closeBtn.addEventListener('click', hideSlide);
        prevBtn.addEventListener('click', (e) => { e.stopPropagation(); showSlide(currentIndex - 1); });
        nextBtn.addEventListener('click', (e) => { e.stopPropagation(); showSlide(currentIndex + 1); });
        overlay.addEventListener('click', (e) => { if (e.target === overlay) hideSlide(); });
        document.addEventListener('keydown', (e) => {
          if (!overlay.classList.contains('active')) return;
          if (e.key === 'ArrowRight') showSlide(currentIndex + 1);
          else if (e.key === 'ArrowLeft') showSlide(currentIndex - 1);
          else if (e.key === 'Escape') hideSlide();
        });
        let touchStartX = 0;
        overlay.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; });
        overlay.addEventListener('touchend', e => {
          const dx = e.changedTouches[0].clientX - touchStartX;
          if (Math.abs(dx) > 50) {
            if (dx < 0) showSlide(currentIndex + 1);
            else showSlide(currentIndex - 1);
          }
        });
      })();
    </script>
  </body>
</html>
